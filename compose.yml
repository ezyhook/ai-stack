name: ai-stack

services:
  tamer:
    build: ./lumo-tamer
    image: localhost/lumo-tamer:local
    container_name: lumo-tamer
    ports:
      - "127.0.0.1:${LUMO_PORT:-3003}:3003"
    volumes:
      # config.yaml must exist as a FILE before the first run (install.sh creates it)
      - ./config.yaml:/app/config.yaml:Z
      - ./sessions:/app/sessions:Z
    secrets:
      - lumo-vault-key
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${OPEN_TERMINAL_TAG:-latest}
    container_name: open-terminal
    ports:
      - "127.0.0.1:${OPEN_TERMINAL_PORT:-8000}:8000"
    volumes:
      - open-terminal-home:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main-slim}
    container_name: open-webui
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-8080}:8080"
    environment:
      # --- Lumo via lumo-tamer (OpenAI-compatible) ---
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URLS=http://tamer:3003/v1
      - OPENAI_API_KEYS=${LUMO_API_KEY:?set LUMO_API_KEY in .env}
      - ENABLE_OLLAMA_API=false

      # --- Open Terminal, connected for all users (applied on every start) ---
      - 'TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","enabled":true,"url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","config":{"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]}}]'

      # --- Background tasks: each one is an extra request to Lumo ---
      # NOTE: these are persistent settings; they only apply on the FIRST start
      # (empty database). Afterwards change them in Admin Panel -> Settings -> Interface.
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - tamer
      - open-terminal
    restart: unless-stopped

secrets:
  lumo-vault-key:
    file: ./secrets/lumo-vault-key

volumes:
  open-terminal-home:
  open-webui-data:
